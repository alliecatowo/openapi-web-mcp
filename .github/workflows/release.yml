name: Release

# Fires only on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing: registered on npmjs.com for this repo, workflow
    # release.yml and environment `npm`. No long-lived registry token is used.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./packages/swagger-ui-webmcp/package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package $pkg" >&2; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w swagger-ui-webmcp
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Publish to npm
        run: npm publish -w swagger-ui-webmcp --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

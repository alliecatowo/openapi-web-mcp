# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  # blocked-upstream: swagger-ui 5.x calls ReactDOM.render, removed in React 19
  # (verified: the demo crashes with react 19.3). Revisit when swagger-ui supports React 19.
  ignore:
  - dependency-name: react
    update-types: [version-update:semver-major]
  - dependency-name: react-dom
    update-types: [version-update:semver-major]
  - dependency-name: "@types/react"
    update-types: [version-update:semver-major]
  - dependency-name: "@types/react-dom"
    update-types: [version-update:semver-major]
- package-ecosystem: npm
  directory: /docs
  schedule:
    interval: weekly
